name: 근태 자동화 (매일 23:00 KST)

on:
  schedule:
    # 23:00 KST = 14:00 UTC, 월~금
    - cron: '0 14 * * 1-5'
  workflow_dispatch:   # GitHub에서 수동 실행 버튼

jobs:
  attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci --ignore-scripts

      - name: Playwright Chromium 설치
        run: npx playwright install chromium --with-deps

      - name: 근태 자동화 실행
        env:
          PLJEC_EMAIL:        ${{ secrets.PLJEC_EMAIL }}
          PLJEC_PASSWORD:     ${{ secrets.PLJEC_PASSWORD }}
          JIRA_EMAIL:         ${{ secrets.JIRA_EMAIL }}
          JIRA_PASSWORD:      ${{ secrets.JIRA_PASSWORD }}
          JIRA_ISSUE:         ${{ secrets.JIRA_ISSUE }}
          WORKLOG_ATTRIBUTE:  ${{ secrets.WORKLOG_ATTRIBUTE }}
        run: node run-once.js

      - name: 스크린샷 업로드 (오류 시 디버그용)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: data/debug_*.png
          if-no-files-found: ignore
